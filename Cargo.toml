[workspace]
members = [".", "./example"]

[package]
edition = "2021"
name = "mysql-binlog-connector-rust"
version = "0.3.4"
categories = ["database"]
description = "mysql binlog connector"
documentation = "https://docs.rs/mysql-binlog-connector-rust"
keywords = ["mysql", "binlog", "connector"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/apecloud/mysql-binlog-connector-rust"
homepage = "https://github.com/apecloud/mysql-binlog-connector-rust"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
rustls = ["dep:tokio-rustls", "dep:rustls"]
openssl-tls = ["dep:openssl", "dep:tokio-openssl"]

[dependencies]
byteorder = "1.4.3"
num_enum = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.87"
serial_test = "3.1.1"
sha1 = "0.10.0"
sha2 = "0.10.6"
zstd = "0.13.2"
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }
dotenv = "0.15.0"
url = "2.3.1"
percent-encoding = "2.3.1"
async-recursion = "1.0.2"
lazy_static = "1.4.0"
thiserror = "2.0.9"
mysql_common = "0.33.0"
base64 = "0.22.1"
log = "0.4.26"
socket2 = "0.6.1"
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
openssl = { version = "0.10", optional = true }
tokio-openssl = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
